name: "🚀 CD Development"
run-name: "🚀 Deploy em development"

on:
  push:
    branches:
      - develop

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'release' }}
  DEPLOYABLE_PATHS: >-
    [
      "infra/terraform"
    ]

jobs:
  detect-deploy-scope:
    name: "🔎 01 · Detectar se há mudança que exige deploy"
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.detect.outputs.deploy_required }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 02 · Analisar arquivos alterados"
        id: detect
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          node <<'DETECTAR_DEPLOY'
          const cp = require('node:child_process');
          const fs = require('node:fs');
          const git = args => cp.execFileSync('git', args, { encoding: 'utf8' }).trim();
          const existe = ref => cp.spawnSync('git', ['cat-file', '-e', ref + '^{commit}']).status === 0;
          const head = process.env.GITHUB_SHA;
          const anterior = process.env.GITHUB_BEFORE;
          const base = anterior && !/^0+$/.test(anterior) && existe(anterior)
            ? anterior
            : existe(head + '~1') ? head + '~1' : head;
          const caminhos = JSON.parse(process.env.DEPLOYABLE_PATHS);
          const alterados = git(['diff', '--name-only', base, head, '--', ...caminhos]);
          const necessario = alterados.length > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'deploy_required=' + necessario + '\n');
          console.log('Deploy necessário neste push: ' + necessario);
          DETECTAR_DEPLOY

  deploy-development:
    name: "☁️ 02 · Deploy em development"
    needs: detect-deploy-scope
    if: needs.detect-deploy-scope.outputs.deploy_required == 'true' && vars.AWS_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/aws-deploy.yml
    with:
      environment_name: development
    secrets: inherit

  open-pr-to-release:
    name: "🔀 03 · Abrir PR para release"
    runs-on: ubuntu-latest
    needs:
      - detect-deploy-scope
      - deploy-development
    if: >-
      !cancelled() &&
      vars.AUTO_PR_ENABLED == 'true' &&
      needs.detect-deploy-scope.result == 'success' &&
      (needs.deploy-development.result == 'success' ||
       (needs.detect-deploy-scope.outputs.deploy_required == 'false' &&
        needs.deploy-development.result == 'skipped'))
    env:
      TERRAFORM_ACTION: ${{ needs.deploy-development.outputs.terraform_action }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔎 Conferir conteúdo cumulativo antes da promoção"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_RESULT: ${{ needs.deploy-development.result }}
        run: |
          node <<'VALIDAR_PROMOCAO_CUMULATIVA'
          function validarPromocao({ git, consultar, caminhos, base, head, resultadoAtual, acaoAtual }) {
            const alterados = git(['diff', '--name-only', base, head, '--', ...caminhos]).trim();
            if (!alterados) return 'SEM_ALTERACAO_IMPLANTAVEL';

            if (resultadoAtual === 'success' && ['apply', 'destroy'].includes(acaoAtual)) {
              return 'OPERACAO_ATUAL_CONFIRMADA';
            }

            // O primeiro parent identifica o push em develop, inclusive após merge de feature.
            const commit = git(['log', '--first-parent', '-1', '--format=%H', head, '--', ...caminhos]).trim();
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error('Commit implantável não identificado.');

            const paginas = consultar('actions/workflows/cd-development.yml/runs?branch=develop&event=push&head_sha=' + commit + '&per_page=100');
            if (!Array.isArray(paginas) || paginas.some(p => !Array.isArray(p.workflow_runs))) {
              throw new Error('Histórico de CD inválido.');
            }

            const execucao = paginas.flatMap(p => p.workflow_runs)
              .filter(r => r.head_sha === commit && r.head_branch === 'develop' && r.event === 'push')
              .sort((a, b) => b.id - a.id)[0];
            if (!execucao || execucao.status !== 'completed' || execucao.conclusion !== 'success' ||
                !Number.isSafeInteger(execucao.id) || !Number.isSafeInteger(execucao.run_attempt) || execucao.run_attempt < 1) {
              throw new Error('Conteúdo implantável pendente sem CD concluído com sucesso.');
            }

            // Usar a tentativa atual; sucesso de uma tentativa antiga não cobre um rerun falho.
            const tentativas = consultar('actions/runs/' + execucao.id + '/attempts/' + execucao.run_attempt + '/jobs?per_page=100');
            if (!Array.isArray(tentativas) || tentativas.some(p => !Array.isArray(p.jobs))) {
              throw new Error('Jobs do CD inválidos.');
            }

            const aplicacoes = tentativas.flatMap(p => p.jobs).filter(j =>
              j.name === '☁️ 02 · Deploy em development / ☁️ 03 · Aplicar ou destruir VPC');
            if (aplicacoes.length !== 1 || aplicacoes[0].conclusion !== 'success') {
              throw new Error('CD sem aplicação/destroy confirmado; documentação não libera código pendente.');
            }

            return 'OPERACAO_ANTERIOR_CONFIRMADA';
          }

          // Execução no runner: erros de Git/GitHub bloqueiam a promoção.
          const cp = require('node:child_process');
          const git = args => cp.execFileSync('git', args, { encoding: 'utf8' });
          const caminhos = JSON.parse(process.env.DEPLOYABLE_PATHS);
          const release = 'refs/remotes/origin/' + process.env.RELEASE_BRANCH;
          const referencia = cp.spawnSync('git', ['show-ref', '--verify', '--quiet', release]);
          if (![0, 1].includes(referencia.status)) throw new Error('Não foi possível consultar a referência release.');
          const base = referencia.status === 0 ? release : 'refs/remotes/origin/main';
          const consultar = endpoint => JSON.parse(cp.execFileSync('gh', [
            'api', '--paginate', '--slurp', 'repos/' + process.env.GITHUB_REPOSITORY + '/' + endpoint
          ], { encoding: 'utf8' }));
          const resultado = validarPromocao({
            git, consultar, caminhos, base, head: process.env.GITHUB_SHA,
            resultadoAtual: process.env.DEPLOY_RESULT, acaoAtual: process.env.TERRAFORM_ACTION
          });
          console.log('Conferência cumulativa de promoção: ' + resultado);
          VALIDAR_PROMOCAO_CUMULATIVA

      - name: "🔀 02 · Criar ou manter PR para release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$TERRAFORM_ACTION" in
            destroy)
              promotion_message="PR automático aberto após destroy bem-sucedido em development. A promoção registra a remoção da infraestrutura; ela não executa Terraform em release."
              ;;
            apply)
              promotion_message="PR automático aberto após deploy bem-sucedido em development. O merge para \`$RELEASE_BRANCH\` continua manual para manter revisão e rastreabilidade."
              ;;
            *)
              promotion_message="PR automático aberto sem deploy físico em development. O merge para \`$RELEASE_BRANCH\` continua manual para manter revisão e rastreabilidade."
              ;;
          esac

          if ! git ls-remote --exit-code --heads origin "$RELEASE_BRANCH"; then
            echo "Release branch '$RELEASE_BRANCH' does not exist. Creating it from main."
            git fetch origin main
            git switch --create "$RELEASE_BRANCH" origin/main
            git push origin "$RELEASE_BRANCH"
          fi

          git fetch origin develop "$RELEASE_BRANCH"

          if [ "$(git rev-parse "origin/develop")" != "$GITHUB_SHA" ]; then
            echo "Branch avançou após este commit. A promoção cabe ao CD do novo commit."
            exit 0
          fi

          pending_commits="$(git rev-list --count "origin/$RELEASE_BRANCH..origin/develop")"
          if [ "$pending_commits" -eq 0 ]; then
            echo "No pending commits from develop to $RELEASE_BRANCH."
            exit 0
          fi

          existing_pr="$(gh pr list --base "$RELEASE_BRANCH" --head develop --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            echo "Pull request #$existing_pr already exists for develop -> $RELEASE_BRANCH."
            exit 0
          fi

          gh pr create \
            --base "$RELEASE_BRANCH" \
            --head develop \
            --title "ci(release): deploy develop to $RELEASE_BRANCH" \
            --body "$promotion_message"
