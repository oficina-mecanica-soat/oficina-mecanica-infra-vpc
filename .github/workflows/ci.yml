name: "🧪 CI"
run-name: "🧪 Validar código · ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches:
      - develop
      - release
      - "release/**"
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_WORKING_DIRECTORY: infra/terraform/environments/dev
  TERRAFORM_VERSION: "1.15.8"

jobs:
  detect_ci_scope:
    name: "🔎 00 · Detectar escopo do PR"
    runs-on: ubuntu-latest
    outputs:
      ci_required: ${{ steps.detect.outputs.ci_required }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 02 · Analisar arquivos alterados"
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ci_required=false
          changed_files="$(mktemp)"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          if [ ! -s "$changed_files" ]; then
            echo "No changed files found. Running full CI for safety."
            ci_required=true
          else
            echo "Changed files:"
            cat "$changed_files"

            while IFS= read -r file; do
              case "$file" in
                *.md)
                  ;;
                *)
                  ci_required=true
                  break
                  ;;
              esac
            done < "$changed_files"
          fi

          echo "ci_required=$ci_required" >> "$GITHUB_OUTPUT"
          echo "CI required: $ci_required"

  validate_git_flow:
    name: "🔀 01 · Validar fluxo de branches"
    runs-on: ubuntu-latest

    steps:
      - name: "🔀 01 · Conferir origem e destino do PR"
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Base branch: $BASE_BRANCH"
          echo "Head branch: $HEAD_BRANCH"

          case "$BASE_BRANCH" in
            develop)
              case "$HEAD_BRANCH" in
                main|release|release/*)
                  echo "Protected stage branches must not open pull requests back to develop."
                  exit 1
                  ;;
                *)
                  echo "Pull request to develop follows the Git Flow entry point."
                  ;;
              esac
              ;;

            release|release/*)
              if [ "$HEAD_BRANCH" != "develop" ]; then
                echo "Pull requests to release must come from develop."
                exit 1
              fi

              echo "Pull request to release follows the Git Flow promotion path."
              ;;

            main)
              case "$HEAD_BRANCH" in
                release|release/*)
                  echo "Pull request to main follows the Git Flow production promotion path."
                  ;;
                *)
                  echo "Pull requests to main must come from release or release/*."
                  exit 1
                  ;;
              esac
              ;;

            *)
              echo "Unsupported protected base branch: $BASE_BRANCH"
              exit 1
              ;;
          esac

  validate_terraform:
    name: "🌐 02 · Validar Terraform da VPC"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "🧪 Validar promoção cumulativa sem AWS"
        run: |
          node <<'TESTAR_PROMOCAO_CUMULATIVA'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const workflow = fs.readFileSync('.github/workflows/cd-development.yml', 'utf8');
          const bloco = workflow.match(/node <<'VALIDAR_PROMOCAO_CUMULATIVA'\r?\n([\s\S]*?)          VALIDAR_PROMOCAO_CUMULATIVA/);
          assert(bloco, 'Guarda cumulativa ausente.');
          const codigo = bloco[1].split(/\r?\n/).map(l => l.slice(10)).join('\n');
          const validar = new Function(codigo.split('// Execução no runner:')[0] + '; return validarPromocao;')();
          const detector = workflow.match(/node <<'DETECTAR_DEPLOY'\r?\n([\s\S]*?)          DETECTAR_DEPLOY/)[1].split(/\r?\n/).map(l => l.slice(10)).join('\n');
          const caminhos = JSON.parse(workflow.match(/DEPLOYABLE_PATHS: >-\r?\n((?:    [^\n]*\r?\n)+)/)[1]);
          const diretorio = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'promocao-cumulativa-'));
          try {
            const git = args => cp.execFileSync('git', args, { cwd: diretorio, encoding: 'utf8' }).trim();
            git(['init', '-b', 'develop']);
            git(['config', 'user.email', 'teste@example.invalid']);
            git(['config', 'user.name', 'Teste local']);
            const gravar = (nome, conteudo) => {
              fs.mkdirSync(path.dirname(path.join(diretorio, nome)), { recursive: true });
              fs.writeFileSync(path.join(diretorio, nome), conteudo);
              git(['add', nome]);
              git(['commit', '-m', 'cenário local']);
              return git(['rev-parse', 'HEAD']);
            };
            const base = gravar('README.md', 'base');
            const docs = gravar('README.md', 'documentação');
            const consultarNunca = () => { throw new Error('Consulta inesperada.'); };
            const opcoes = { git, caminhos, base, head: docs, consultar: consultarNunca };
            assert.equal(validar(opcoes), 'SEM_ALTERACAO_IMPLANTAVEL');

            git(['switch', '-c', 'feature/teste']);
            gravar('infra/terraform/exemplo.tf', 'código');
            git(['switch', 'develop']);
            git(['merge', '--no-ff', 'feature/teste', '-m', 'merge funcional']);
            const implantavel = git(['rev-parse', 'HEAD']);
            const head = gravar('README.md', 'documentação depois do código');
            const detectar = (antes, atual) => {
              const saida = path.join(diretorio, 'saida-runner.txt');
              fs.writeFileSync(saida, '');
              cp.execFileSync(process.execPath, ['-e', detector], {
                cwd: diretorio,
                env: { ...process.env, DEPLOYABLE_PATHS: JSON.stringify(caminhos), GITHUB_BEFORE: antes, GITHUB_SHA: atual, GITHUB_OUTPUT: saida }
              });
              return fs.readFileSync(saida, 'utf8').trim();
            };
            assert.equal(detectar(base, implantavel), 'deploy_required=true');
            assert.equal(detectar(implantavel, head), 'deploy_required=false');
            let chamadas = [];
            const run = { id: 123, run_attempt: 2, head_sha: implantavel, head_branch: 'develop', event: 'push', status: 'completed', conclusion: 'success' };
            const job = { name: '☁️ 02 · Deploy em development / ☁️ 03 · Aplicar ou destruir VPC', conclusion: 'success' };
            const consultar = endpoint => {
              chamadas.push(endpoint);
              return endpoint.startsWith('actions/workflows/') ? [{ workflow_runs: [run] }] : [{ jobs: [job] }];
            };
            const comCodigo = { ...opcoes, head, consultar };
            assert.throws(() => validar({ ...comCodigo, consultar: () => [{ workflow_runs: [] }] }), /sem CD/);
            assert.equal(validar(comCodigo), 'OPERACAO_ANTERIOR_CONFIRMADA');
            assert(chamadas[0].includes('head_sha=' + implantavel), 'Deve buscar o merge em develop, não o commit da feature/documentação.');
            assert(chamadas[1].includes('/attempts/2/jobs'), 'Deve consultar a tentativa atual.');
            for (const estado of ['skipped', 'failure', 'cancelled']) {
              job.conclusion = estado;
              assert.throws(() => validar(comCodigo), /sem aplicação/);
            }
            job.conclusion = 'success';
            assert.throws(() => validar({ ...comCodigo, consultar: endpoint => endpoint.startsWith('actions/workflows/') ? [{ workflow_runs: [run] }] : [{}] }), /Jobs/);
            assert.throws(() => validar({ ...comCodigo, consultar: endpoint => [{ workflow_runs: [{ ...run, head_sha: '0'.repeat(40) }] }] }), /sem CD/);
            assert.throws(() => validar({ ...comCodigo, consultar: endpoint => [{ workflow_runs: [run, { ...run, id: 124, conclusion: 'failure' }] }] }), /sem CD/);
            run.conclusion = 'failure';
            assert.throws(() => validar(comCodigo), /sem CD/);
            run.conclusion = 'success';
            run.status = 'in_progress';
            assert.throws(() => validar(comCodigo), /sem CD/);
            run.status = 'completed';
            assert.throws(() => validar({ ...comCodigo, consultar: consultarNunca }), /Consulta inesperada/);
            assert.throws(() => validar({ ...comCodigo, consultar: () => ({}) }), /Histórico/);
            assert.equal(validar({ ...comCodigo, consultar: consultarNunca, resultadoAtual: 'success', acaoAtual: 'apply' }), 'OPERACAO_ATUAL_CONFIRMADA');
            assert.equal(validar({ ...comCodigo, consultar: consultarNunca, resultadoAtual: 'success', acaoAtual: 'destroy' }), 'OPERACAO_ATUAL_CONFIRMADA');
            assert.throws(() => validar({ ...comCodigo, consultar: consultarNunca, resultadoAtual: 'skipped', acaoAtual: 'apply' }), /Consulta inesperada/);
            gravar('infra/terraform/exemplo.tf', 'outro código ainda sem deploy');
            const posterior = gravar('README.md', 'mais documentação');
            assert.throws(() => validar({ ...comCodigo, head: posterior }), /sem CD/);
            gravar('infra/terraform/exemplo.tf', 'código');
            assert.equal(validar({ ...comCodigo, base: implantavel, head: git(['rev-parse', 'HEAD']), consultar: consultarNunca }), 'SEM_ALTERACAO_IMPLANTAVEL');
            console.log('Promoção cumulativa: código sem deploy bloqueado; código implantado seguido de docs permitido; falhas, skips, reruns e novo código protegidos.');
          } finally {
            assert.equal(path.dirname(fs.realpathSync(diretorio)), fs.realpathSync(process.env.RUNNER_TEMP || os.tmpdir()));
            fs.rmSync(diretorio, { recursive: true, force: true });
          }
          TESTAR_PROMOCAO_CUMULATIVA

      - name: "🧪 Validar artefatos e cache por tentativa"
        run: |
          node <<'TESTAR_ARTEFATOS_TENTATIVA'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const workflow = fs.readFileSync('.github/workflows/aws-deploy.yml', 'utf8').replace(/\r\n/g, '\n');
          const etapas = workflow.split(/(?=      - name:)/);
          const upload = etapas.filter(s => /uses: actions\/upload-artifact@/.test(s));
          const download = etapas.filter(s => /uses: actions\/download-artifact@/.test(s));
          const restores = etapas.filter(s => /uses: actions\/cache\/restore@/.test(s));
          const saves = etapas.filter(s => /uses: actions\/cache\/save@/.test(s));
          assert(upload.length > 0 && upload.length === download.length);
          assert.equal(restores.length, 2);
          assert.equal(saves.length, 1);
          const valor = (etapa, campo) => {
            const encontrado = etapa.match(new RegExp('^          ' + campo + ': (.+)$', 'm'));
            assert(encontrado, 'Campo obrigatório: ' + campo);
            return encontrado[1];
          };
          // Escapar o dólar impede interpolação prematura pelo próprio GitHub Actions no teste.
          const expressao = nome => '\u0024{{ ' + nome + ' }}';
          const expandir = (modelo, tentativa = 1, execucao = 100, conta = '111111111111', ambiente = 'development') => modelo
            .replaceAll(expressao('github.run_id'), String(execucao))
            .replaceAll(expressao('github.run_attempt'), String(tentativa))
            .replaceAll(expressao('steps.aws_credentials.outputs.aws-account-id'), conta)
            .replaceAll(expressao('inputs.environment_name'), ambiente);
          for (const produtor of upload) {
            const nome = valor(produtor, 'name');
            assert(nome.includes(expressao('github.run_id')) && nome.includes(expressao('github.run_attempt')));
            const consumidores = download.filter(s => valor(s, 'name') === nome);
            assert.equal(consumidores.length, 1, 'Download deve usar exatamente o nome publicado.');
            assert(produtor.includes('if-no-files-found: error'));
            assert(!consumidores[0].includes('pattern:') && !consumidores[0].includes('continue-on-error:'), 'Sem fallback silencioso de artefato.');
            const tentativa1 = expandir(nome);
            const tentativa2 = expandir(nome, 2);
            assert.notEqual(tentativa1, tentativa2, 'Rerun não pode colidir com artefato imutável anterior.');
            assert.notEqual(tentativa2, expandir(nome, 2, 101), 'Execuções diferentes devem permanecer isoladas.');
            const publicados = new Map([[tentativa1, 'conteúdo da primeira tentativa']]);
            assert(!publicados.has(tentativa2), 'Sem nova publicação, a segunda tentativa não pode baixar a primeira.');
            publicados.set(tentativa2, 'conteúdo da segunda tentativa');
            assert.equal(publicados.get(expandir(valor(consumidores[0], 'name'), 2)), 'conteúdo da segunda tentativa');
          }
          const chaveFinal = valor(saves[0], 'key');
          assert(saves[0].includes('if: always()'), 'Falha do apply não pode pular a preservação do state.');
          for (const etapa of [...restores, ...saves]) {
            const chave = valor(etapa, 'key');
            for (const campo of ['github.run_id', 'github.run_attempt', 'steps.aws_credentials.outputs.aws-account-id', 'inputs.environment_name']) {
              assert(chave.includes(expressao(campo)), 'Cache deve preservar conta, ambiente, execução e tentativa.');
            }
            assert.equal(chave, chaveFinal, 'Restaurar/salvar o mesmo escopo de state.');
            assert(etapa.includes('/terraform.tfstate') && etapa.includes('/terraform.tfstate.backup'));
          }
          for (const etapa of restores) {
            const prefixo = etapa.match(/          restore-keys: \|\n            ([^\n]+)/)?.[1];
            assert(prefixo && prefixo.includes(expressao('steps.aws_credentials.outputs.aws-account-id')) && prefixo.includes(expressao('inputs.environment_name')));
            assert.equal(expandir(chaveFinal).startsWith(expandir(prefixo)), true);
            assert.notEqual(expandir(prefixo), expandir(prefixo, 1, 100, '222222222222'));
            assert.notEqual(expandir(prefixo), expandir(prefixo, 1, 100, '111111111111', 'production'));
          }
          const antes = expandir(chaveFinal);
          const depois = expandir(chaveFinal, 2);
          assert.notEqual(antes, depois, 'State de falha parcial precisa de chave gravável na nova tentativa.');
          console.log('Artefatos/cache por execução e tentativa: nomes simétricos, sem reaproveitar plano/pacote anterior, conta/ambiente isolados e state sempre preservado na configuração.');
          TESTAR_ARTEFATOS_TENTATIVA

      - name: "🧪 Validar recuperação segura de destroy"
        run: node --test .github/scripts/*.test.cjs

      - name: "🛡️ Validar bloqueio de execução AWS"
        run: |
          node <<'VALIDAR_BLOQUEIO_AWS'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const workflow = fs.readFileSync('.github/workflows/aws-deploy.yml', 'utf8');
          for (const job of ['prepare_and_plan', 'apply_or_destroy']) {
            const trecho = workflow.split(`\n  ${job}:`)[1];
            assert.ok(trecho, `Job ${job} deve existir.`);
            const restaurar = trecho.indexOf('uses: actions/cache/restore@');
            const validar = trecho.indexOf('run: node .github/scripts/bootstrap-account-state.cjs');
            const prepararDestroy = trecho.indexOf('run: node .github/scripts/prepare-destroy.cjs');
            const inicializar = trecho.indexOf('init -input=false');
            assert.ok(restaurar >= 0 && validar > restaurar && prepararDestroy > validar && inicializar > prepararDestroy,
              `${job}: restaurar cache antes de validar state, preparar destroy e inicializar.`);
          }
          const bloco = workflow.match(/        run: \|\r?\n([\s\S]*?)\r?\n  prepare_and_plan:/);
          assert.ok(bloco, 'Etapa real de resolução deve existir.');
          const codigo = bloco[1].split(/\r?\n/).map(l => l.slice(10)).join('\n');
          const cd = fs.readFileSync('.github/workflows/cd-development.yml', 'utf8');
          assert.ok(cd.includes("if: needs.detect-deploy-scope.outputs.deploy_required == 'true' && vars.AWS_DEPLOY_ENABLED == 'true'"));
          const prefixo = path.join(os.tmpdir(), 'vpc-bloqueio-');
          const dir = fs.mkdtempSync(prefixo);
          try {
            fs.writeFileSync(path.join(dir, 'terraform-action.env'), 'TERRAFORM_ACTION=apply\n');
            const executar = (habilitado, ref, arquivo) => {
              const resultado = cp.spawnSync('bash', ['-c', codigo], {
                cwd: dir, encoding: 'utf8', env: { ...process.env, DEPLOY_ENABLED: habilitado,
                  GITHUB_REF: ref, TF_WORKING_DIRECTORY: dir.replaceAll('\\', '/'),
                  GITHUB_OUTPUT: path.join(dir, arquivo).replaceAll('\\', '/') }
              });
              assert.ifError(resultado.error);
              return resultado;
            };
            for (const valor of ['', 'false', 'invalido']) {
              assert.notEqual(executar(valor, 'refs/heads/develop', 'bloqueado').status, 0);
              assert.ok(!fs.existsSync(path.join(dir, 'bloqueado')));
            }
            assert.notEqual(executar('true', 'refs/heads/main', 'branch-invalida').status, 0);
            assert.ok(!fs.existsSync(path.join(dir, 'branch-invalida')));
            assert.equal(executar('true', 'refs/heads/develop', 'permitido').status, 0);
            assert.equal(fs.readFileSync(path.join(dir, 'permitido'), 'utf8').trim(), 'terraform_action=apply');
          } finally {
            assert.ok(path.resolve(dir).startsWith(path.resolve(prefixo)));
            fs.rmSync(dir, { recursive: true });
          }
          console.log('Bloqueios do CD e do workflow reutilizável validados sem AWS.');
          VALIDAR_BLOQUEIO_AWS

      - name: "🎨 03 · Verificar formatação Terraform"
        run: terraform fmt -check -recursive infra/terraform

      - name: "🚀 04 · Inicializar Terraform sem backend"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -backend=false -input=false

      - name: "🔍 05 · Validar configuração Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate

  quality_gate:
    name: "🚦 03 · Quality gate"
    runs-on: ubuntu-latest
    needs:
      - detect_ci_scope
      - validate_git_flow
      - validate_terraform
    if: always()

    steps:
      - name: "🚦 01 · Conferir status de todos os jobs do CI"
        run: |
          if [ "${{ needs.detect_ci_scope.result }}" != "success" ]; then
            echo "CI scope detection failed."
            exit 1
          fi

          if [ "${{ needs.validate_git_flow.result }}" != "success" ]; then
            echo "Git Flow branch validation failed."
            exit 1
          fi

          if [ "${{ needs.detect_ci_scope.outputs.ci_required }}" != "true" ]; then
            echo "Only documentation or Markdown files changed. Heavy CI skipped safely."
            exit 0
          fi

          if [ "${{ needs.validate_terraform.result }}" != "success" ]; then
            echo "Terraform validation failed."
            exit 1
          fi

          echo "All CI responsibilities passed."
